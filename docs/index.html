<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Lead Tracker · Sharma Electric &amp; HVAC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Inter:wght@400;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#264387; --dnavy:#1a2f61; --gold:#F0A846; --ink:#1d2433; --gray:#5b6478;
  --line:#dfe4ee; --bg:#f4f6fb; --safe-b: env(safe-area-inset-bottom, 0px);
}
*{box-sizing:border-box}
html{font-size:18px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1rem/1.45 Inter,-apple-system,"Segoe UI",Arial,sans-serif}
header{background:#fff;border-bottom:3px solid var(--gold)}
.hd-in{max-width:900px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.hd-logo{height:44px;width:auto;display:block}
.hd-app{font:700 1.15rem/1.1 "Barlow Semi Condensed",sans-serif;color:var(--dnavy);text-transform:uppercase;letter-spacing:.05em;text-align:right}
main{max-width:900px;margin:0 auto;padding:14px 16px 8px}
.stats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:4px;padding:8px 12px;min-width:104px}
.stat b{display:block;font:600 1.3rem/1.1 "IBM Plex Mono",monospace;color:var(--dnavy)}
.stat span{font-size:.82rem;color:var(--gray);text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:0;border-bottom:1px solid var(--line);margin-bottom:14px}
.tab{flex:1;min-height:52px;background:none;border:none;border-bottom:3px solid transparent;font:700 1.1rem/1 "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.05em;color:var(--gray);cursor:pointer}
.tab.on{color:var(--dnavy);border-bottom-color:var(--gold)}
.panel{background:#fff;border:1px solid var(--line);border-radius:4px;padding:14px;margin-bottom:12px}
.panel h2{font:700 1.25rem/1.15 "Barlow Semi Condensed",sans-serif;color:var(--dnavy);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px;padding-bottom:6px;border-bottom:2px solid var(--gold)}
label.fl{display:block;font:700 .85rem/1.2 "Barlow Semi Condensed",sans-serif;color:var(--dnavy);text-transform:uppercase;letter-spacing:.04em;margin:10px 0 4px}
input[type=search],select{width:100%;min-height:50px;padding:8px 10px;border:1px solid var(--gray);border-radius:4px;background:#fff;color:var(--ink);font:400 1rem/1.2 Inter,sans-serif}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:560px){.frow{grid-template-columns:1fr}}
.checks{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.chk{display:inline-flex;align-items:center;gap:8px;min-height:48px;padding:6px 14px;border:1px solid var(--line);border-radius:4px;background:#fff;cursor:pointer;font-weight:600}
.chk input{width:22px;height:22px;accent-color:var(--navy)}
.note{font-size:.85rem;color:var(--gray);margin-top:10px}
.count{color:var(--gray);font-size:.92rem;margin:4px 0 10px}
.card{background:#fff;border:1px solid var(--line);border-radius:4px;padding:12px 14px;margin-bottom:10px}
.card .nm{font:700 1.3rem/1.15 "Barlow Semi Condensed",sans-serif;color:var(--dnavy)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chip{display:inline-block;padding:2px 9px;border-radius:4px;font:700 .8rem/1.5 "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--line);color:var(--gray);background:#fff}
.chip.pa{background:var(--gold);border-color:var(--gold);color:var(--dnavy)}
.chip.pb{background:var(--navy);border-color:var(--navy);color:#fff}
.chip.rs{border-color:var(--gold);color:var(--dnavy)}
.chip.client{background:var(--gold);border-color:var(--gold);color:var(--dnavy)}
.chip.dnc{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.pub{background:var(--gray);border-color:var(--gray);color:#fff}
.chip.contacted{border-color:var(--navy);color:var(--navy)}
.chip.responded{background:var(--dnavy);border-color:var(--dnavy);color:#fff}
.chip.via{background:var(--dnavy);border-color:var(--dnavy);color:#fff}
.meta{color:var(--gray);font-size:.95rem}
.kv{margin-top:6px}
.kv div{padding:3px 0}
.kv .k{color:var(--gray);font-size:.82rem;text-transform:uppercase;letter-spacing:.04em;display:inline-block;min-width:96px}
a.act{color:var(--navy);font-weight:600;text-decoration:none;overflow-wrap:anywhere}
a.act:hover{text-decoration:underline}
.flags{margin-top:8px;font-size:.88rem;color:var(--gray);border-top:1px solid var(--line);padding-top:8px;overflow-wrap:anywhere}
.src{font-size:.82rem;color:var(--gray);margin-top:4px}
.marks{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;border-top:1px solid var(--line);padding-top:10px}
.marks button{min-height:48px;padding:6px 14px;border:1px solid var(--dnavy);border-radius:4px;background:#fff;color:var(--dnavy);font:700 .95rem/1 "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.marks button.done{background:var(--navy);color:#fff}
.empty{background:#fff;border:1px solid var(--line);border-radius:4px;padding:22px;text-align:center;color:var(--gray)}
footer{text-align:center;color:var(--gray);font-size:.85rem;padding:14px 16px calc(26px + var(--safe-b))}
footer img{height:26px;width:auto;display:block;margin:0 auto 6px}
.vbtn{min-height:48px;padding:6px 16px;border:1px solid var(--dnavy);border-radius:4px;background:#fff;color:var(--dnavy);font:700 .95rem/1 "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
.vbtn.on{background:var(--navy);color:#fff}
.more{display:block;width:100%;min-height:52px;margin:4px 0 14px;border:1px solid var(--dnavy);border-radius:4px;background:#fff;color:var(--dnavy);font:700 1.05rem/1 "Barlow Semi Condensed",sans-serif;text-transform:uppercase;letter-spacing:.04em;cursor:pointer}
body.compact .card{padding:8px 12px;margin-bottom:6px}
body.compact .card .nm{font-size:1.1rem}
body.compact .flags,body.compact .src,body.compact .marks{display:none}
body.compact .kv div{padding:1px 0}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="hd-in">
    <img class="hd-logo" src="logo.svg" alt="Sharma Electric &amp; HVAC">
    <div class="hd-app">Lead Tracker</div>
  </div>
</header>
<main>
  <div class="stats" id="stats"></div>
  <div class="tabs" role="tablist">
    <button class="tab on" id="tab-leads" role="tab">Leads</button>
    <button class="tab" id="tab-ahj" role="tab">Permit Offices</button>
  </div>

  <section id="view-leads">
    <div class="panel">
      <h2>Find a lead</h2>
      <label class="fl" for="q">Search</label>
      <input type="search" id="q" placeholder="Company, contact, county, email…" autocomplete="off">
      <div class="frow">
        <div><label class="fl" for="f-county">County</label><select id="f-county"></select></div>
        <div><label class="fl" for="f-type">Type</label><select id="f-type"></select></div>
        <div><label class="fl" for="f-pri">Priority</label>
          <select id="f-pri"><option value="">All priorities</option><option>A</option><option>B</option><option>C</option></select></div>
        <div><label class="fl" for="f-list">List</label>
          <select id="f-list"><option value="">All lists</option><option>Master 500</option><option>Reserve</option><option>Board</option></select></div>
        <div><label class="fl" for="f-status">Status</label>
          <select id="f-status"><option value="">All statuses</option><option>Lead</option><option>Client</option><option>Do not contact</option><option>Public sector</option></select></div>
        <div><label class="fl" for="f-contact-f">Contacted</label>
          <select id="f-contact-f"><option value="">All</option><option value="contacted">Contacted</option><option value="not">Not contacted yet</option><option value="responded">Responded</option></select></div>
        <div><label class="fl" for="f-sort">Sort</label>
          <select id="f-sort"><option value="rank">Ranked (production first)</option><option value="az">Company A–Z</option><option value="za">Company Z–A</option><option value="pri">Priority A–C</option><option value="contacted-new">Contacted — newest first</option><option value="contacted-old">Contacted — longest ago (follow up)</option><option value="emailed">Most emailed</option><option value="county">County A–Z</option></select></div>
      </div>
      <label class="fl">View</label>
      <div class="checks" style="margin-top:0">
        <button type="button" class="vbtn on" id="v-cards">Cards</button>
        <button type="button" class="vbtn" id="v-compact">Compact list</button>
        <label class="chk"><input type="checkbox" id="f-hideempty"> Hide rows with no contact info</label>
      </div>
      <div class="checks">
        <label class="chk"><input type="checkbox" id="f-email"> Has email</label>
        <label class="chk"><input type="checkbox" id="f-phone"> Has phone</label>
        <label class="chk"><input type="checkbox" id="f-contact"> Named contact</label>
      </div>
      <div class="note">Contact marks come from Sharma's email history. Marks you tap save on this device — tell Jarvis to make them permanent.</div>
    </div>
    <div class="count" id="lead-count"></div>
    <div id="lead-list"></div>
  </section>

  <section id="view-ahj" hidden>
    <div class="panel">
      <h2>Find a permit office</h2>
      <label class="fl" for="aq">Search</label>
      <input type="search" id="aq" placeholder="Office, city, county…" autocomplete="off">
      <div class="frow">
        <div><label class="fl" for="a-county">County</label><select id="a-county"></select></div>
        <div><label class="fl" for="a-sort">Sort</label>
          <select id="a-sort"><option value="az">Office A–Z</option><option value="county">County A–Z</option><option value="deleg">Delegated first</option></select></div>
      </div>
      <div class="checks">
        <label class="chk"><input type="checkbox" id="a-deleg"> Delegated to county only</label>
      </div>
    </div>
    <div class="count" id="ahj-count"></div>
    <div id="ahj-list"></div>
  </section>
</main>
<footer>
  <span>Sharma Electric &amp; HVAC · Lic. EC13013924 · CAC1823596</span>
  <div style="margin-top:8px;font-weight:600;color:#5b6478">Powered by <span style="display:inline-block;vertical-align:middle;background:#1a2f61;border-radius:6px;padding:6px 14px;margin-left:4px"><img src="sharma360-logo-rev2.png" alt="SHARMA360" style="margin:0"></span></div>
</footer>
<script src="lock.js"></script>
<script>
"use strict";
var DATA = null;
var MARKS_KEY = "lt-marks:v1";
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function normName(n){return String(n||"").toUpperCase().replace(/[^A-Z0-9 ]/g," ").replace(/\s+/g," ").trim()}
function getMarks(){ try { return JSON.parse(localStorage.getItem(MARKS_KEY) || "{}"); } catch(e){ return {}; } }
function setMarks(m){ try { localStorage.setItem(MARKS_KEY, JSON.stringify(m)); } catch(e){} }
function eff(l){
  var m = getMarks()[normName(l.company)] || {};
  return {
    contacted: m.contacted || l.contacted || "",
    responded: (m.responded || l.responded === "Yes") ? "Yes" : "",
    device: !!m.contacted || !!m.responded
  };
}
function countiesOf(l){return l.county.split(";").map(function(s){return s.trim()}).filter(Boolean)}
function uniqSorted(arr){var s={},o=[];arr.forEach(function(x){if(x&&!s[x]){s[x]=1;o.push(x)}});return o.sort()}
function fillSelect(el, values, allLabel){
  el.innerHTML = '<option value="">'+esc(allLabel)+'</option>' + values.map(function(v){return '<option>'+esc(v)+'</option>'}).join("");
}
function telLink(p){return '<a class="act" href="tel:+1'+esc(p.replace(/[^0-9]/g,""))+'">'+esc(p)+'</a>'}
function siteLink(w){
  var url = /^https?:\/\//i.test(w) ? w : "https://" + w;
  var disp = w.replace(/^https?:\/\//i,"").replace(/\/$/,"");
  return '<a class="act" href="'+esc(url)+'" target="_blank" rel="noopener">'+esc(disp)+'</a>';
}
function renderStats(){
  var L = DATA.leads;
  var master = L.filter(function(l){return l.list==="Master 500"}).length;
  var contacted = L.filter(function(l){return eff(l).contacted}).length;
  var responded = L.filter(function(l){return eff(l).responded}).length;
  var st = [
    [L.length,"builders / GCs tracked"],[master,"in the master 500"],
    [contacted,"contacted"],[responded,"responded"],[DATA.ahj.length,"permit offices"]
  ];
  document.getElementById("stats").innerHTML = st.map(function(s){
    return '<div class="stat"><b>'+s[0]+'</b><span>'+s[1]+'</span></div>';
  }).join("");
}
function statusChip(l){
  if (l.status === "Client") return '<span class="chip client">Client</span>';
  if (l.status === "Do not contact") return '<span class="chip dnc">Do not contact</span>';
  if (l.status === "Public sector") return '<span class="chip pub">Public sector</span>';
  return "";
}
function leadCard(l){
  var e = eff(l);
  var chips = '<span class="chip p'+l.priority.toLowerCase()+'">'+esc(l.priority)+' priority</span>'
    + '<span class="chip">'+esc(l.type)+'</span>'
    + (l.list !== "Master 500" ? '<span class="chip rs">'+esc(l.list)+'</span>' : '')
    + statusChip(l)
    + (e.contacted ? '<span class="chip contacted">Contacted '+esc(e.contacted)+'</span>' : '')
    + (e.responded ? '<span class="chip responded">Responded</span>' : '');
  var kv = "";
  if (l.contact) kv += '<div><span class="k">Contact</span>'+esc(l.contact)+'</div>';
  if (l.phone) kv += '<div><span class="k">Phone</span>'+telLink(l.phone)+'</div>';
  if (l.email) kv += '<div><span class="k">Email</span><a class="act" href="mailto:'+esc(l.email)+'">'+esc(l.email)+'</a></div>';
  if (l.website) kv += '<div><span class="k">Website</span>'+siteLink(l.website)+'</div>';
  if (e.contacted) kv += '<div><span class="k">Contacted</span>'+esc(e.contacted)+(l.contact_note ? ' · '+esc(l.contact_note) : '')+(e.device ? ' · marked on this device' : '')+'</div>';
  if (e.responded) kv += '<div><span class="k">Responded</span>Yes</div>';
  var key = normName(l.company);
  var marks = '<div class="marks">'
    + '<button data-mark="contacted" data-key="'+esc(key)+'" class="'+(e.contacted?'done':'')+'">'+(e.contacted?'Contacted ✓':'Mark contacted')+'</button>'
    + '<button data-mark="responded" data-key="'+esc(key)+'" class="'+(e.responded?'done':'')+'">'+(e.responded?'Responded ✓':'Mark responded')+'</button>'
    + (e.device ? '<button data-mark="clear" data-key="'+esc(key)+'">Clear my marks</button>' : '')
    + '</div>';
  return '<article class="card"><div class="nm">'+esc(l.company)+'</div>'
    + '<div class="chips">'+chips+'</div>'
    + '<div class="meta">'+esc(l.county)+'</div>'
    + (kv ? '<div class="kv">'+kv+'</div>' : '')
    + (l.source ? '<div class="src">Source: '+esc(l.source)+'</div>' : '')
    + (l.flags ? '<div class="flags">'+esc(l.flags)+'</div>' : '')
    + marks
    + '</article>';
}
function renderLeads(){
  var q = document.getElementById("q").value.trim().toLowerCase();
  var county = document.getElementById("f-county").value;
  var type = document.getElementById("f-type").value;
  var pri = document.getElementById("f-pri").value;
  var list = document.getElementById("f-list").value;
  var status = document.getElementById("f-status").value;
  var cf = document.getElementById("f-contact-f").value;
  var sort = document.getElementById("f-sort").value;
  var fe = document.getElementById("f-email").checked;
  var fp = document.getElementById("f-phone").checked;
  var fc = document.getElementById("f-contact").checked;
  var rows = DATA.leads.filter(function(l){
    if (list && l.list !== list) return false;
    if (status && l.status !== status) return false;
    if (county && countiesOf(l).indexOf(county) === -1) return false;
    if (type && l.type !== type) return false;
    if (pri && l.priority !== pri) return false;
    var e = eff(l);
    if (cf === "contacted" && !e.contacted) return false;
    if (cf === "not" && e.contacted) return false;
    if (cf === "responded" && !e.responded) return false;
    if (fe && !l.email) return false;
    if (fp && !l.phone) return false;
    if (fc && !l.contact) return false;
    if (q){
      var hay = (l.company+" "+l.contact+" "+l.county+" "+l.email+" "+l.type).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  if (document.getElementById("f-hideempty").checked)
    rows = rows.filter(function(l){ return l.phone || l.email || l.contact; });
  if (sort === "az") rows.sort(function(a,b){return a.company.localeCompare(b.company)});
  if (sort === "za") rows.sort(function(a,b){return b.company.localeCompare(a.company)});
  if (sort === "pri") rows.sort(function(a,b){return a.priority.localeCompare(b.priority) || a.company.localeCompare(b.company)});
  if (sort === "contacted-new") rows.sort(function(a,b){return (eff(b).contacted || "").localeCompare(eff(a).contacted || "") || a.company.localeCompare(b.company)});
  if (sort === "contacted-old") rows.sort(function(a,b){
    var ca = eff(a).contacted, cb = eff(b).contacted;
    if (!ca && !cb) return a.company.localeCompare(b.company);
    if (!ca) return 1; if (!cb) return -1;
    return ca.localeCompare(cb) || a.company.localeCompare(b.company);
  });
  if (sort === "emailed") rows.sort(function(a,b){return (b.sent_count||0) - (a.sent_count||0) || a.company.localeCompare(b.company)});
  if (sort === "county") rows.sort(function(a,b){return (countiesOf(a)[0]||"~").localeCompare(countiesOf(b)[0]||"~") || a.company.localeCompare(b.company)});
  var total = rows.length;
  var page = rows.slice(0, SHOWN);
  document.getElementById("lead-count").textContent = "Showing " + page.length + " of " + total + " builders (" + DATA.leads.length + " tracked)";
  document.getElementById("lead-list").innerHTML = total
    ? page.map(leadCard).join("") + (total > SHOWN ? '<button class="more" id="more-leads">Show more — ' + (total - SHOWN) + ' remaining</button>' : "")
    : '<div class="empty">No builders match those filters.</div>';
  var mb = document.getElementById("more-leads");
  if (mb) mb.addEventListener("click", function(){ SHOWN += 100; renderLeads(); });
}
function ahjCard(o){
  var delegated = o.via && o.via.toLowerCase() !== "own office";
  var chips = delegated ? '<span class="chip via">Permits via '+esc(o.via)+'</span>' : '<span class="chip">Own office</span>';
  var kv = "";
  if (o.phone) kv += '<div><span class="k">Phone</span>'+telLink(o.phone)+'</div>';
  if (o.portal) kv += '<div><span class="k">Permits</span>'+siteLink(o.portal)+'</div>';
  return '<article class="card"><div class="nm">'+esc(o.ahj)+'</div>'
    + '<div class="chips">'+chips+'</div>'
    + '<div class="meta">'+esc(o.county)+' County'+(o.type ? ' · '+esc(o.type) : '')+'</div>'
    + (kv ? '<div class="kv">'+kv+'</div>' : '')
    + (o.flags ? '<div class="flags">'+esc(o.flags)+'</div>' : '')
    + '</article>';
}
function renderAhj(){
  var q = document.getElementById("aq").value.trim().toLowerCase();
  var county = document.getElementById("a-county").value;
  var deleg = document.getElementById("a-deleg").checked;
  var rows = DATA.ahj.filter(function(o){
    if (county && o.county !== county) return false;
    if (deleg && (!o.via || o.via.toLowerCase() === "own office")) return false;
    if (q){
      var hay = (o.ahj+" "+o.county+" "+o.via).toLowerCase();
      if (hay.indexOf(q) === -1) return false;
    }
    return true;
  });
  var asort = document.getElementById("a-sort").value;
  if (asort === "az") rows.sort(function(a,b){return a.ahj.localeCompare(b.ahj)});
  if (asort === "county") rows.sort(function(a,b){return a.county.localeCompare(b.county) || a.ahj.localeCompare(b.ahj)});
  if (asort === "deleg") rows.sort(function(a,b){
    var da = (a.via && a.via.toLowerCase() !== "own office") ? 0 : 1;
    var db = (b.via && b.via.toLowerCase() !== "own office") ? 0 : 1;
    return da - db || a.ahj.localeCompare(b.ahj);
  });
  var atotal = rows.length;
  var apage = rows.slice(0, ASHOWN);
  document.getElementById("ahj-count").textContent = "Showing " + apage.length + " of " + atotal + " permit offices";
  document.getElementById("ahj-list").innerHTML = atotal
    ? apage.map(ahjCard).join("") + (atotal > ASHOWN ? '<button class="more" id="more-ahj">Show more — ' + (atotal - ASHOWN) + ' remaining</button>' : "")
    : '<div class="empty">No permit offices match those filters.</div>';
  var ab = document.getElementById("more-ahj");
  if (ab) ab.addEventListener("click", function(){ ASHOWN += 100; renderAhj(); });
}
var SHOWN = 100, ASHOWN = 100;
function wire(){
  ["q","f-county","f-type","f-pri","f-list","f-status","f-contact-f","f-sort","f-email","f-phone","f-contact","f-hideempty"].forEach(function(id){
    var el = document.getElementById(id);
    var h = function(){ SHOWN = 100; renderLeads(); };
    el.addEventListener("input", h); el.addEventListener("change", h);
  });
  ["aq","a-county","a-deleg","a-sort"].forEach(function(id){
    var el = document.getElementById(id);
    var h = function(){ ASHOWN = 100; renderAhj(); };
    el.addEventListener("input", h); el.addEventListener("change", h);
  });
  var vc = document.getElementById("v-cards"), vk = document.getElementById("v-compact");
  function setView(compact){
    document.body.classList.toggle("compact", compact);
    vc.classList.toggle("on", !compact); vk.classList.toggle("on", compact);
    try { localStorage.setItem("lt-view:v1", compact ? "compact" : "cards"); } catch(e){}
  }
  vc.addEventListener("click", function(){ setView(false); });
  vk.addEventListener("click", function(){ setView(true); });
  try { if (localStorage.getItem("lt-view:v1") === "compact") setView(true); } catch(e){}
  document.getElementById("lead-list").addEventListener("click", function(ev){
    var b = ev.target.closest("button[data-mark]");
    if (!b) return;
    var marks = getMarks(), key = b.getAttribute("data-key"), kind = b.getAttribute("data-mark");
    var today = new Date().toISOString().slice(0,10);
    if (kind === "clear") delete marks[key];
    else {
      marks[key] = marks[key] || {};
      if (kind === "contacted") marks[key].contacted = marks[key].contacted ? "" : today;
      if (kind === "responded") marks[key].responded = !marks[key].responded;
      if (!marks[key].contacted && !marks[key].responded) delete marks[key];
    }
    setMarks(marks); renderStats(); renderLeads();
  });
  var tl = document.getElementById("tab-leads"), ta = document.getElementById("tab-ahj");
  tl.addEventListener("click", function(){ tl.classList.add("on"); ta.classList.remove("on");
    document.getElementById("view-leads").hidden = false; document.getElementById("view-ahj").hidden = true; });
  ta.addEventListener("click", function(){ ta.classList.add("on"); tl.classList.remove("on");
    document.getElementById("view-ahj").hidden = false; document.getElementById("view-leads").hidden = true; });
}
SharmaLock.load("data.enc.json", { appName: "Lead Tracker", logo: "logo.svg",
  blurb: "Enter the office code to see the leads and permit offices." }).then(function(data){
  DATA = data;
  fillSelect(document.getElementById("f-county"),
    uniqSorted(DATA.leads.flatMap(countiesOf)), "All counties");
  fillSelect(document.getElementById("f-type"),
    uniqSorted(DATA.leads.map(function(l){return l.type})), "All types");
  fillSelect(document.getElementById("a-county"),
    uniqSorted(DATA.ahj.map(function(o){return o.county})), "All counties");
  renderStats(); wire(); renderLeads(); renderAhj();
}).catch(function(err){
  document.querySelector("main").innerHTML =
    '<div class="empty">Could not load the lead data.<br>' + esc(err && err.message || err) + '</div>';
});
</script>
</body>
</html>
